name: verification-windows

on:
  push:
    branches:
      - production-hardening
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        shell: pwsh
        run: python -m pip check
      - name: Compile source and tests
        shell: pwsh
        run: python -m compileall -q psy29 tests
      - name: Run complete pytest suite
        shell: pwsh
        run: python -m pytest -q -rA
