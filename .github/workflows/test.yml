name: tests

on:
  push:
    branches:
      - production-hardening
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          python -m pip install -r requirements.txt 2>&1 | tee install-output.txt
          status=${PIPESTATUS[0]}
          echo "PIP_EXIT_CODE=$status" >> install-output.txt
          exit "$status"
      - name: Run test suite
        shell: bash
        run: |
          set +e
          python -m pytest -q -rA 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "PYTEST_EXIT_CODE=$status" >> pytest-output.txt
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            install-output.txt
            pytest-output.txt
          if-no-files-found: ignore
